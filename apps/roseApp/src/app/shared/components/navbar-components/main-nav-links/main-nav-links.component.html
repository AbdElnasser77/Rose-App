    <div [class]="mobile() 
         ?'flex flex-col w-full border-t border-gray-200 dark:border-zinc-700' 
         :'flex items-center gap-6 lg:gap-10'">

        @for (item of navItems; track item.route) {

        <a [routerLink]="item.route"
        [class]="mobile()
        ? 'flex items-center gap-3 px-4 py-3 text-sm text-zinc-800  dark:text-zinc-50 hover:bg-gray-100 dark:hover:bg-zinc-700'
        : 'flex items-center gap-1 px-2 pb-1 text-xs font-semibold text-white dark:text-zinc-800 border-b-2 border-transparent hover:text-pink-300 dark:hover:text-maroon-600 transition-colors'"
        >
            <lucide-icon [img]="item.icon" class="w-5 h-5" />
            {{ item.label | translate }}
        </a>

        }
    </div>
