<form [formGroup]="passwordForm" class="flex flex-col gap-8">
  <lib-reusable-input
    id="currentPassword"
    formControlName="currentPassword"
    type="password"
    [label]="'ACCOUNT.CHANGE_PASSWORD.OLD_PASSWORD' | translate"
    [placeholder]="'ACCOUNT.CHANGE_PASSWORD.PASSWORD_PLACEHOLDER' | translate"
  />

  <hr class="border-zinc-200 dark:border-zinc-700" />

  <div class="flex flex-col gap-7">
    <div class="flex flex-col gap-[6px]">
      <lib-reusable-input
        id="newPassword"
        formControlName="newPassword"
        type="password"
        [label]="'AUTH.NEW_PASSWORD' | translate"
        [placeholder]="
          'ACCOUNT.CHANGE_PASSWORD.PASSWORD_PLACEHOLDER' | translate
        "
      />

      @if (sameAsOld) {
        <p class="font-mono text-xs text-red-600 dark:text-red-400 px-[10px]">
          {{ 'ACCOUNT.CHANGE_PASSWORD.SAME_AS_OLD' | translate }}
        </p>
      }
    </div>

    <div class="flex flex-col gap-[6px]">
      <lib-reusable-input
        id="confirmPassword"
        formControlName="confirmPassword"
        type="password"
        [label]="'ACCOUNT.CHANGE_PASSWORD.CONFIRM_NEW_PASSWORD' | translate"
        [placeholder]="
          'ACCOUNT.CHANGE_PASSWORD.PASSWORD_PLACEHOLDER' | translate
        "
      />

      @if (mismatch) {
        <p class="font-mono text-xs text-red-600 dark:text-red-400 px-[10px]">
          {{ 'AUTH.PASSWORDS_DONT_MATCH' | translate }}
        </p>
      }
    </div>
  </div>

  <div class="flex justify-end pt-4">
    <lib-button
      variant="Primary"
      size="auto"
      [disabled]="passwordForm.invalid"
      (clicked)="submit()"
      customClass="px-8 py-3.5 text-[16px]"
    >
      {{ 'ACCOUNT.NAV.CHANGE_PASSWORD' | translate }}
    </lib-button>
  </div>
</form>
