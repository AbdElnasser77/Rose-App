@if (loading()) {
  <div class="grid grid-cols-[repeat(auto-fit,302px)] justify-start gap-6">
    @for (skeleton of skeletons; track $index) {
      <div class="flex flex-col gap-3 w-full max-w-[302px]">
        <p-skeleton height="16rem" styleClass="rounded-lg" />
        <p-skeleton width="70%" height="1.25rem" />
        <p-skeleton width="40%" height="1rem" />
        <p-skeleton width="50%" height="1.5rem" />
      </div>
    }
  </div>
} @else if (products().length) {
  <div class="grid grid-cols-[repeat(auto-fit,302px)] justify-center gap-6 mb-[171px]">
    @for (product of products(); track product.id) {
      <app-product-card
        [product]="product"
        [isWishlisted]="wishlistedIds().has(product.id)"
        (cardDetailsClicked)="cardDetails.emit($event)"
        (wishListClicked)="wishList.emit($event)"
        (quickViewClicked)="quickView.emit($event)"
        (addToCartClicked)="addToCart.emit($event)"
      />
    }
  </div>
} @else {
  <p class="py-16 text-center text-gray-500">
    {{ 'PRODUCTS.EMPTY' | translate }}
  </p>
}
