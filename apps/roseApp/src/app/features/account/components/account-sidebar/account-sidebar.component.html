<nav
  class="w-full flex flex-row lg:flex-col gap-2 overflow-x-auto lg:overflow-x-visible rounded-2xl bg-zinc-100 dark:bg-zinc-800 p-2 lg:p-3 lg:min-h-[520px]"
>
  <a
    routerLink="/account/profile"
    routerLinkActive
    #profileLink="routerLinkActive"
    [ngClass]="profileLink.isActive ? activeItemClass : idleItemClass"
    class="shrink-0 rounded-lg px-4 py-2.5 lg:py-3 flex items-center gap-2 lg:gap-3 text-start font-inter text-sm lg:text-[15px] font-medium whitespace-nowrap transition-colors"
  >
    <lucide-icon [img]="UserPen" class="w-5 h-5 shrink-0"></lucide-icon>
    <span>{{ 'ACCOUNT.NAV.PROFILE' | translate }}</span>
  </a>

  <a
    routerLink="/account/password"
    routerLinkActive
    #passwordLink="routerLinkActive"
    [ngClass]="passwordLink.isActive ? activeItemClass : idleItemClass"
    class="shrink-0 rounded-lg px-4 py-2.5 lg:py-3 flex items-center gap-2 lg:gap-3 text-start font-inter text-sm lg:text-[15px] font-medium whitespace-nowrap transition-colors"
  >
    <lucide-icon [img]="Lock" class="w-5 h-5 shrink-0"></lucide-icon>
    <span>{{ 'ACCOUNT.NAV.CHANGE_PASSWORD' | translate }}</span>
  </a>

  <lib-button
    class="shrink-0 ms-auto lg:ms-0 lg:mt-auto"
    variant="Ghost"
    size="full"
    (clicked)="logout()"
    customClass="justify-start! rounded-lg px-4 py-2.5 lg:py-3 gap-2 lg:gap-3 font-inter text-sm lg:text-[15px] font-medium text-red-600! dark:text-red-400!"
  >
    <span
      leftIcon
      class="inline-flex shrink-0"
      [class.-scale-x-100]="isRtl()"
    >
      <lucide-icon [img]="LogOut" class="w-5 h-5 rotate-90"></lucide-icon>
    </span>
    {{ 'ACCOUNT.NAV.LOGOUT' | translate }}
  </lib-button>
</nav>
