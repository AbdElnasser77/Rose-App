<!-- SKELETON: replace with the designed navbar (Layout ticket). -->
<header
  class="flex h-14 shrink-0 items-center gap-3 border-b border-zinc-200 bg-white px-4 sm:px-6 dark:border-zinc-800 dark:bg-zinc-900"
>
  <button
    type="button"
    class="cursor-pointer rounded-md p-1.5 text-zinc-600 hover:bg-zinc-100 lg:hidden dark:text-zinc-300 dark:hover:bg-zinc-800"
    [attr.aria-label]="'DASHBOARD.LAYOUT.TOGGLE_MENU' | translate"
    (click)="menuToggle.emit()"
  >
    <lucide-angular [img]="Menu" class="size-5" />
  </button>

  <span class="text-sm font-semibold text-zinc-900 dark:text-zinc-50">
    {{ 'DASHBOARD.LAYOUT.BRAND' | translate }}
  </span>
</header>
