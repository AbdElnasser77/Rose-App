<section class="min-h-[calc(100vh-80px)] bg-zinc-50 px-4 py-5 dark:bg-zinc-950 md:hidden">
  <div class="mx-auto flex w-full max-w-md flex-col">
    <header class="mb-4 flex items-center gap-3">
      <button
        type="button"
        (click)="back()"
        class="flex h-10 w-10 items-center justify-center rounded-full bg-white text-zinc-700 shadow-sm transition-colors hover:bg-zinc-100 dark:bg-zinc-800 dark:text-zinc-100 dark:hover:bg-zinc-700 cursor-pointer"
        aria-label="Go back"
      >
        <lucide-angular [img]="MoveLeft" class="h-5 w-5"></lucide-angular>
      </button>

    
    </header>

    <app-notification-list class="w-full" />
  </div>
</section>
