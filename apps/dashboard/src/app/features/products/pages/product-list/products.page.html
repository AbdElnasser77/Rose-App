<div class="flex flex-col gap-4 bg-white dark:bg-[#1C1C1E] p-4 md:p-6 pb-[71px]">
<div class="flex  items-center justify-between">
  
<h1
  class="font-inter text-[24px] font-semibold leading-none tracking-normal text-[#27272A] dark:text-white">
  {{ 'DASHBOARD.PRODUCTS.TITLE' | translate }}
</h1>
 <lib-button   class="text-white dark:text-zinc-800 cursor-pointer" (clicked)="onAddClicked()">
  <lucide-icon leftIcon [img]="Plus"></lucide-icon>
  <span class="hidden md:block">
    {{ 'DASHBOARD.PRODUCTS.ADD_NEW' | translate }}
  </span>
  
</lib-button>
        
</div>

<app-dynamic-table
  [columns]="columns"
  [data]="products()"
  [actions]="actions"
  (searchChange)="onSearch($event)"
  [page]="page()"
  [totalPages]="totalPages()"
  (pageChange)="onPageChange($event)"
  >
</app-dynamic-table>
<ng-template #stockTemplate let-stock let-product="row">
  <span
    [class.text-red-600]="stock <= 5"
    [class.dark:text-red-400]="stock <= 5">
    {{ stock }}
  </span>
</ng-template>
</div>
