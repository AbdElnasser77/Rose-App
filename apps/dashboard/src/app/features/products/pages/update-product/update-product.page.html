<div class="w-full flex flex-col gap-6  p-6 pb-[121px] md:pb-0">
    <h1 class="font-inter text-[24px] font-semibold leading-none tracking-normal text-[#27272A] dark:text-white">
        {{ 'DASHBOARD.PRODUCTS.UPDATE_PRODUCT' | translate }}
    </h1>
    <div class="w-full xl:w-[746px] min-h-[714px]  bg-white dark:bg-[#1C1C1E] rounded-2xl flex flex-col gap-[18px]">
        <app-dynamic-form [fields]="fields()" 
        [initialValues]="initialValues()"
        submitLabel="DASHBOARD.PRODUCTS.UPDATE_PRODUCT"
        (submitted)="onProductUpdate($event)" />


        <div class="mt-5 flex w-full gap-4 ms-auto">
        <button type="button" class="flex h-[38px] w-fit items-center gap-[6px]
         rounded-[10px] border border-[#00000014]
         bg-white px-[10px]
         font-inter text-[14px] font-normal leading-none text-[#155DFC]
         transition hover:opacity-90">
                <lucide-icon [img]="Image" class="h-[18px] w-[18px]" />

                <span>View Product Cover</span>
            </button>


        <button type="button" class="flex h-[38px] w-fit items-center gap-[6px]
         rounded-[10px] border border-[#00000014]
         bg-white px-[10px]
         font-inter text-[14px] font-normal leading-none text-[#155DFC]
         transition hover:opacity-90">
                <lucide-icon [img]="Image" class="h-[18px] w-[18px]" />

                <span>View Product Gallery</span>
            </button>


        </div>
    </div>
</div>
