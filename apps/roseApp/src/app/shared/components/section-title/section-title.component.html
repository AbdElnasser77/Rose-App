<div class="section-title-wrapper mb-8 flex flex-col gap-[8px]" 
     [ngClass]="{
        'text-left items-start': alignment === 'left',
        'text-center items-center': alignment === 'center'
     }">
    @if (subTitle) {
    <span class="text-[#FF668B] font-sarabun text-[16px] font-bold uppercase tracking-[0.25em] leading-none ">
        {{ subTitle }}
    </span>
    }

    <h2
        class="text-[#741C21] font-sarabun font-bold tracking-tight leading-tight align-middle relative inline-block text-[36px]
        dark:text-soft-pink-200">

        <span class="relative z-10">{{ mainTitle }}</span>

        <div class="w-[73%] h-[21px] absolute -bottom-1.5 start-0 -z-1 dark:bg-[#3F3F46] bg-[#FFE0E7] rounded-e-[20px] dark:bg-zinc-700">
        </div>
        <div class="absolute  w-[30%] h-[2px] -bottom-1.5 start-0 bg-[#E65073] dark:bg-soft-pink-500"></div>
    </h2>

</div>
