<div class="relative isolate">
  <div
    #mapEl
    class="w-full h-[320px] rounded-xl overflow-hidden border border-zinc-200 dark:border-zinc-700"
  ></div>
  <button
    type="button"
    (click)="findMyLocation()"
    class="absolute top-4 right-4 z-[1000] flex items-center gap-2 rounded-lg border border-maroon-600 dark:border-soft-pink-300 bg-white dark:bg-zinc-800 px-3 py-2 text-sm font-medium text-maroon-600 dark:text-soft-pink-300 shadow-sm hover:bg-maroon-50 dark:hover:bg-zinc-700 transition-colors cursor-pointer"
  >
    <lucide-icon [img]="MapPinHouse" class="w-4 h-4"></lucide-icon>
    {{ 'CHECKOUT.ADD_ADDRESS.FIND_MY_LOCATION' | translate }}
  </button>
</div>
