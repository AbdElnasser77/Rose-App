<div class="flex justify-between items-center mb-6">
    <div>
        <h1 class="text-4xl font-bold">
            {{ 'CART.TITLE' | translate }}
        </h1>
        @if(cartCount () >0){
        <p class="text-gray-500 mt-1">
            {{ cartCount () }}
            {{ 'CART.PRODUCTS' | translate }}
        </p>
        }
    </div>
    @if(cartCount () >0){
    <button pButton severity="danger" class="bg-[#FBEAEA] text-[#A6252A] border-0!"
        icon="pi pi-trash"
        [label]="'CART.CLEAR_CART' | translate" (click)="clearCart()">
    </button>
    }
</div>
<div class="border border-gray-300 rounded-xl overflow-hidden bg-white">
    @for(item of  cartItems(); track item.id){
         <app-cart-item-card
         [item]="item"
         (increaseClicked)="increase($event)"
         (decreaseClicked)="decrease($event)"
        (removeClicked)="remove($event)"
        (productClicked)="goToProductDetails($event)">
       </app-cart-item-card>

    }

    @empty {
    <div class="text-center py-20">
        <i class="pi pi-shopping-cart text-6xl text-gray-300"></i>

        <p class="mt-5 text-xl text-gray-500">
            {{ 'CART.EMPTY_CART' | translate }}
        </p>
    </div>
    }
   
</div>
 <button
        pButton
        severity="danger"
        class="bg-[#A6252A] mt-6"
        icon="pi pi-arrow-left"
        routerLink="/home"
        [label]="'CART.CONTINUE_SHOPPING' | translate">
</button>
