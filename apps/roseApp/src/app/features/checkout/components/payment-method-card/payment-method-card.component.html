<button class="w-full min-w-[373px] min-h-[299px] rounded-xl border border-[#E4E4E7]  
         p-4 flex flex-col gap-2.5 cursor-pointer transition-all" [ngClass]="paymentSelected()
      ? 'bg-[#FAFAFA] '
      : 'bg-white ' "
       (click)="onSelect()"
      >

    <div class="flex flex-col items-center justify-center">

        <!-- Payment Image -->
        <div class="flex justify-center">
            <img [src]="paymentMethod().image | assetUrl" [alt]="paymentMethod().name"
                class="w-[195px] h-[195px] object-contain" />
        </div>

        <h3 class="font-sarabun text-2xl font-semibold leading-none tracking-normal " [ngClass]="paymentSelected()
          ? 'text-[#A6252A]'
          : 'text-[#27272A]' ">

            {{ paymentMethod().name}}
        </h3>
        <small class="font-mulish text-[14px] font-semibold leading-[150%] tracking-normal text-[#71717A]">
            {{ paymentMethod().description }}
        </small>

    </div>
</button>
