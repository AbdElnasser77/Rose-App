<div class="flex flex-col gap-4">
  <nav aria-label="Breadcrumb">
    <ol class="flex items-center gap-2 text-sm text-zinc-500 dark:text-zinc-400">
      <li aria-current="page">{{ 'DASHBOARD.OVERVIEW.BREADCRUMB' | translate }}</li>
    </ol>
  </nav>

  <h1 class="sr-only">{{ 'DASHBOARD.OVERVIEW.TITLE' | translate }}</h1>

  @if (failed()) {
    <div
      class="flex flex-col items-center gap-3 rounded-2xl border border-zinc-200/80 bg-white p-10 text-center dark:border-zinc-700/60 dark:bg-zinc-900"
      role="alert"
    >
      <p class="text-sm text-zinc-600 dark:text-zinc-300">
        {{ 'DASHBOARD.OVERVIEW.LOAD_FAILED' | translate }}
      </p>
      <button
        type="button"
        class="cursor-pointer rounded-lg bg-zinc-900 px-4 py-2 text-sm text-white hover:bg-zinc-800 dark:bg-soft-pink-300 dark:text-zinc-900 dark:hover:bg-soft-pink-400"
        (click)="retry()"
      >
        {{ 'DASHBOARD.OVERVIEW.RETRY' | translate }}
      </button>
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-12">
      <!-- Headline figures -->
      <div class="lg:col-span-5">
        <app-overview-card>
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <app-stat-tile
              labelKey="DASHBOARD.OVERVIEW.TOTAL_PRODUCTS"
              [value]="summary()?.totalProducts ?? 0"
              [icon]="Package"
              tone="rose"
              [loading]="loading()"
            />
            <app-stat-tile
              labelKey="DASHBOARD.OVERVIEW.TOTAL_ORDERS"
              [value]="summary()?.totalOrders ?? 0"
              [icon]="FileText"
              tone="blue"
              [loading]="loading()"
            />
            <app-stat-tile
              labelKey="DASHBOARD.OVERVIEW.TOTAL_CATEGORIES"
              [value]="summary()?.totalCategories ?? 0"
              [icon]="ClipboardList"
              tone="purple"
              [loading]="loading()"
            />
            <app-stat-tile
              labelKey="DASHBOARD.OVERVIEW.TOTAL_REVENUE"
              [value]="summary()?.totalRevenue ?? 0"
              [icon]="CircleDollarSign"
              tone="green"
              [suffix]="currency() || null"
              [loading]="loading()"
            />
          </div>
        </app-overview-card>
      </div>

      <div class="lg:col-span-7">
        <app-categories-card
          [categories]="categories()"
          [loading]="loading()"
        />
      </div>

      <!-- Order mix and revenue trend -->
      <div class="lg:col-span-4">
        <app-orders-status-card
          [summary]="orderStatus()"
          [loading]="loading()"
        />
      </div>

      <div class="lg:col-span-8">
        <app-revenue-card
          [series]="revenue()"
          [activePeriod]="revenuePeriod()"
          [currency]="currency()"
          [loading]="loading()"
          (periodChange)="onRevenuePeriodChange($event)"
        />
      </div>

      <!-- Product movement -->
      <div class="lg:col-span-6">
        <app-top-selling-card
          [products]="topSelling()"
          [currency]="currency()"
          [loading]="loading()"
        />
      </div>

      <div class="lg:col-span-6">
        <app-low-stock-card [products]="lowStock()" [loading]="loading()" />
      </div>
    </div>
  }
</div>
