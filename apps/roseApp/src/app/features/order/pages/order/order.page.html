<div class="w-[90%] mx-auto p-4 space-y-6 min-h-screen">
  <h1 class="text-3xl font-bold text-gray-800 mb-6">{{ 'ORDERS.TITLE' | translate }}</h1>

  @if (loading()) {
  <div class="text-center py-10 text-gray-500">{{ 'ORDERS.LOADING' | translate }}</div>
  } @else {
  @for (order of orders(); track order.id) {


          <app-order-card [order]="order"  />
        
      
  
  } @empty {
  <div class="text-center py-10 text-gray-500">{{ 'ORDERS.NO_ORDERS' | translate }}</div>
  }
  }
</div>
