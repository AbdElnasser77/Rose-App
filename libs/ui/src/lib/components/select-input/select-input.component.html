<div class="flex flex-col gap-[6px] w-full relative">
    @if(label){
    <label [for]="id"
  [ngClass]="
    hasError
      ? 'text-red-600 dark:text-red-500'
      : 'text-zinc-800 dark:text-zinc-50'
  "
     class="font-inter text-[14px] font-medium leading-none ">
        {{ label }}
        @if (showRequiredIndicator) {
        <span class="text-red-600">*</span>
        }
    </label>
    }
    <div class="relative w-full">

        <select [id]="id" [value]="value()" (blur)="emitTouched()" (change)="onSelectChange($event)"  [ngClass]="[
        'w-full h-[49px] rounded-[10px] border ps-4 pe-10 font-inter text-[14px] font-normal text-zinc-400 appearance-none placeholder:text-zinc-500 placeholder:font-inter leading-none outline-none dark:bg-zinc-700 dark:text-zinc-50',

        hasError
          ? 'border-red-600 focus:border-red-600 dark:border-red-500 dark:focus:border-red-500'
          : 'border-zinc-300 focus:border-zinc-500 dark:border-zinc-600 dark:focus:border-soft-pink-200 dark:hover:border-soft-pink-50 transition'
      ]">
            <option value="" disabled selected>
                {{ placeholder }}
            </option>

            @for (opt of options; track opt.value) {
            <option [value]="opt.value" class=" border border-zinc-300">
                {{ opt.label }}
            </option>
            }
        </select>

        <div
            class="absolute end-4 w-[20px] h-[20px] top-1/2 -translate-y-1/2 flex justify-center items-center pointer-events-none text-zinc-500 dark:text-zinc-400">
            <lucide-icon [img]="ChevronDown" />

        </div>
    </div>
    <div class="absolute top-full start-0 mt-1 z-20">
        <lib-validation-errors [control]="control"></lib-validation-errors>
    </div>

</div>
