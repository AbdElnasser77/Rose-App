<div class="flex justify-center">
    <p-dialog 
    [visible]="visible()"
    [modal]="true"
    [closable]="false"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: 'min(90vw, 440px)' }"
    styleClass="payment-success-dialog" 
       >
       <div class="flex flex-col items-center px-2 py-4 text-center">

        <!-- Success Icon -->
        <div
            class="mb-5 flex h-20 w-20 items-center justify-center
                   rounded-full bg-green-50
                   dark:bg-green-500/10"
        >
            <div
                class="flex h-14 w-14 items-center justify-center
                       rounded-full bg-green-100
                       dark:bg-green-500/20"
            >
                <lucide-icon
                    [img]="CircleCheck"
                    class="h-9 w-9 text-green-600 dark:text-green-400"
                />
            </div>
        </div>

        <!-- Title -->
        <h2
            class="mb-2 font-sarabun text-2xl font-bold
                   text-[#27272A] dark:text-white"
        >
            {{ 'PAYMENT.SUCCESS.TITLE' | translate }}
        </h2>

        <!-- Description -->
        <p
            class="max-w-[340px] font-sarabun text-base leading-relaxed
                   text-[#71717A] dark:text-[#A1A1AA]"
        >
            {{ 'PAYMENT.SUCCESS.DESCRIPTION' | translate }}
        </p>

        <!-- Actions -->
        <div class="mt-7 flex w-full flex-col gap-3 sm:flex-row">

            <!-- Continue Shopping -->
            <button
                type="button"
                (click)="onContinueShopping()"
                class="flex h-11 flex-1 items-center justify-center cursor-pointer
                       rounded-[10px] bg-[#A6252A] px-4
                       font-sarabun text-base font-semibold text-white
                       transition-colors hover:bg-[#741C21]
                       dark:bg-[#FFA3B9] dark:text-[#27272A]
                       dark:hover:bg-[#FF89A6]"
            >
                {{ 'PAYMENT.SUCCESS.CONTINUE_SHOPPING' | translate }}
            </button>

            <!-- View Orders -->
            <button
                type="button"
                (click)="onViewOrders()"
                class="flex h-11 flex-1 items-center justify-center cursor-pointer
                       rounded-[10px] border border-[#A6252A]
                       bg-transparent px-4
                       font-sarabun text-base font-semibold
                       text-[#A6252A]
                       transition-colors hover:bg-[#A6252A]/5
                       dark:border-[#FFC2D0]
                       dark:text-[#FFC2D0]
                       dark:hover:bg-[#FFC2D0]/10"
            >
                {{ 'PAYMENT.SUCCESS.VIEW_ORDERS' | translate }}
            </button>

        </div>

       </div>

    </p-dialog>
</div>
