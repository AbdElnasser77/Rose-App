<section
  class="flex h-full flex-col rounded-2xl border border-zinc-200/80 bg-white p-4 sm:p-5 dark:border-zinc-700/60 dark:bg-zinc-900"
>
  @if (titleKey()) {
    <header
      class="mb-4 flex items-center gap-3"
      [class.justify-center]="centerTitle()"
      [class.justify-between]="!centerTitle()"
    >
      <h2 class="text-lg font-semibold text-zinc-900 dark:text-zinc-50">
        {{ titleKey() | translate }}
      </h2>
      <ng-content select="[cardActions]" />
    </header>
  }

  <div class="min-h-0 flex-1">
    <ng-content />
  </div>
</section>
