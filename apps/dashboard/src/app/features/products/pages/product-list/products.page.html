<div class="flex flex-col gap-4 bg-white dark:bg-[#1C1C1E] p-4 md:p-6 pb-15">

  <h1 class="text-2xl font-semibold text-zinc-900 dark:text-white">Products</h1>
  <app-dynamic-table
  [columns]="columns"
  [data]="products()"
  [actions]="actions"
  (searchChange)="onSearch($event)"
  [page]="page()"
  [totalPages]="totalPages()"
  (pageChange)="onPageChange($event)"
  >
</app-dynamic-table>
</div>
