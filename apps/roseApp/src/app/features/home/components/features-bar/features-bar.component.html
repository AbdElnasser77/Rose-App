<section 
    class="w-full px-4 sm:px-6 lg:px-[81px] mt-10">

    <div class="w-full bg-[#FBEAEA] rounded-[16px] mx-auto 
                grid grid-cols-1 sm:grid-cols-2  xl:grid-cols-4
                p-6 sm:p-8 lg:p-[40px]  gap-y-8 dark:bg-[#3F3F46]">

        @for (feature of features; track feature.title ; let i = $index) {
        <div
        libIntersectionObserverDirective 
        [observeOnce]="true" 
        [rootMargin]="'0px 0px -100px 0px'" 
         (visibilityChange)="onFeatureCardVisible($event.isIntersecting,i)"
         class="flex items-center justify-center w-full transition-all duration-700 ease-out"
         [style.transition-delay.ms]="i * 150"
         [ngClass]="{
             'opacity-100 translate-y-0': isFeatureVisible(i),
             'opacity-0 translate-y-6': !isFeatureVisible(i)
          }">


            <div
                class="flex flex-col sm:flex-row items-center justify-center sm:justify-start xl:justify-center  gap-4 w-full max-w-[240px] sm:max-w-[260px]  text-start">

                <div class="shrink-0">
                    <lib-button size="icon-lg" variant="Primary" shape="circle">
                        <lucide-icon [img]="feature.icon" class="w-10 h-10 
                           stroke-[1.25] text-white dark:text-[#27272A]"></lucide-icon>
                    </lib-button>
                </div>

                <div class="flex flex-col justify-center gap-1 min-w-0  ">
                    <h4
                        class="text-[#A6252A] font-sarabun  font-semibold text-[20px] sm:text-[18px] text-center sm:text-start lg:text-[20px] leading-tight dark:text-[#FFC2D0] ">
                        {{feature.title | translate}}
                    </h4>

                    <p
                        class="font-sarabun font-normal  text-[14px] sm:text-[13px] lg:text-[14px] leading-relaxed text-[#71717A] dark:text-[#D9D9D9] text-center  sm:text-start">
                        {{feature.desc | translate}}
                    </p>
                </div>

            </div>

        </div>
        }

    </div>
</section>
