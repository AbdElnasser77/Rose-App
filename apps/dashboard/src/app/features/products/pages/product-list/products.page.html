<div class="flex flex-1 flex-col min-h-0 gap-4 bg-white dark:bg-[#1C1C1E] p-4 md:p-6 pb-[104px] md:pb-6">
<div class="flex  items-center justify-between">
  
<h1
  class="font-inter text-[24px] font-semibold leading-none tracking-normal text-[#27272A] dark:text-white">
  {{ 'DASHBOARD.PRODUCTS.TITLE' | translate }}
</h1>
    <!-- Icon-only below md: size="icon" gives a true 42x42 box and skips the
         label gap that pushed the glyph off centre. -->
    <lib-button class="md:hidden" size="icon" shape="square" (clicked)="onAddClicked()">
      <lucide-icon leftIcon [img]="Plus" [size]="20"></lucide-icon>
    </lib-button>

    <lib-button class="hidden md:block text-white dark:text-zinc-800 cursor-pointer"
      size="auto" (clicked)="onAddClicked()">
      <lucide-icon leftIcon [img]="Plus"></lucide-icon>
      {{ 'DASHBOARD.PRODUCTS.ADD_NEW' | translate }}
    </lib-button>
        
</div>

<app-dynamic-table
  [columns]="columns"
  [data]="products()"
  [actions]="actions"
  (searchChange)="onSearch($event)"
  [page]="page()"
  [totalPages]="totalPages()"
  (pageChange)="onPageChange($event)"
  >
</app-dynamic-table>
<ng-template #stockTemplate let-stock let-product="row">
  <span
    [class.text-red-600]="stock <= 5"
    [class.dark:text-red-400]="stock <= 5">
    {{ stock }}
  </span>
</ng-template>
</div>
