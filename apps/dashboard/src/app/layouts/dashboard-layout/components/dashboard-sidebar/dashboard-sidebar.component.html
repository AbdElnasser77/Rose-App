<!-- SKELETON: replace with the designed sidebar (Layout ticket). -->
@if (open()) {
  <div
    class="fixed inset-0 z-30 bg-black/40 lg:hidden"
    (click)="dismiss.emit()"
    aria-hidden="true"
  ></div>
}

<!--
  Toggled with display rather than a transform: `lg:translate-x-0` and
  `-translate-x-full` are both single classes, so source order decides the
  winner and the panel stayed off-screen on desktop. `max-lg:` scopes the
  hiding to small viewports, where nothing competes with it.
-->
<aside
  class="fixed inset-y-0 start-0 z-40 w-60 shrink-0 border-e border-zinc-200 bg-white lg:static dark:border-zinc-800 dark:bg-zinc-900"
  [class]="open() ? 'max-lg:block' : 'max-lg:hidden'"
>
  <nav class="flex h-full flex-col gap-1 p-3">
    @for (link of links; track link.path) {
      <!--
        Swapped wholesale rather than layered: `text-white` and `text-zinc-700`
        are both single classes, so source order decides and the active label
        rendered grey on the dark pill.
      -->
      <a
        [routerLink]="link.path"
        routerLinkActive
        #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: link.path === '/dashboard' }"
        class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm"
        [class]="rla.isActive ? activeItemClass : idleItemClass"
        (click)="dismiss.emit()"
      >
        <lucide-angular [img]="link.icon" class="size-4 shrink-0" />
        <span class="truncate">{{ link.labelKey | translate }}</span>
      </a>
    }
  </nav>
</aside>
