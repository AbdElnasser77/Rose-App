@if (totalPages() > 1) {
  <nav class="flex items-center justify-center gap-2 py-8">
    <button
      type="button"
      class="px-3 py-2 rounded-md border border-gray-300 text-sm text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed"
      [disabled]="page() === 1"
      (click)="prev()"
    >
      Prev
    </button>

    @for (p of pages(); track p) {
      <button
        type="button"
        class="min-w-10 px-3 py-2 rounded-md border text-sm"
        [ngClass]="
          p === page()
            ? 'bg-[#DC2626] text-white border-[#DC2626]'
            : 'border-gray-300 text-gray-700 hover:bg-gray-100'
        "
        (click)="goTo(p)"
      >
        {{ p }}
      </button>
    }

    <button
      type="button"
      class="px-3 py-2 rounded-md border border-gray-300 text-sm text-gray-700 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed"
      [disabled]="page() === totalPages()"
      (click)="next()"
    >
      Next
    </button>
  </nav>
}
