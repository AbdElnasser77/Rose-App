<section
  class="w-full px-4 sm:px-6 lg:px-[81px] py-8 flex flex-col gap-6 md:gap-8"
>
  <div class="flex items-center gap-3">
    <button
      type="button"
      [attr.aria-label]="'ACCOUNT.TITLE' | translate"
      (click)="menuOpen.set(true)"
      class="lg:hidden shrink-0 cursor-pointer text-zinc-700 dark:text-zinc-300 hover:text-maroon-600 dark:hover:text-soft-pink-300 transition-colors"
    >
      <lucide-icon
        [img]="Menu"
        class="w-8 h-8 md:w-12 md:h-12"
      ></lucide-icon>
    </button>

    <h1
      class="font-sarabun text-3xl md:text-5xl font-bold text-zinc-900 dark:text-white"
    >
      {{ 'ACCOUNT.TITLE' | translate }}
    </h1>
  </div>

  <div
    class="flex flex-col lg:grid lg:grid-cols-[264px_1fr] gap-6 lg:gap-10 items-start"
  >
    <app-account-sidebar class="hidden lg:block w-full" />

    <div class="w-full min-w-0">
      <router-outlet />
    </div>
  </div>
</section>

<p-drawer
  [(visible)]="menuOpen"
  [position]="drawerPosition()"
  [header]="'ACCOUNT.TITLE' | translate"
  [style]="{ width: '280px' }"
>
  <app-account-sidebar embedded (navigated)="menuOpen.set(false)" />
</p-drawer>
