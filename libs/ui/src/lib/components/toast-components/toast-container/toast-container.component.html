<!-- z above PrimeNG's overlay layer (config zIndex.modal = 1100, so dialogs land
  around 1101 and their mask one below). At z-50 toasts rendered underneath the
  mask and read as greyed out. -->
<div class="fixed bottom-4 right-4 sm:bottom-[20px] sm:right-[20px]  w-[90vw] sm:w-[447px]
  max-w-[447px] z-[1300] flex flex-col gap-3  items-end">
    @for (toast of toasts(); track toast.id) {

    <lib-toast [message]="toast.message" [variant]="toast.type === 'success'
        ? 'Success'
        : toast.type === 'error'
        ? 'Error'
        : 'Default'" (closed)="dismissToast(toast.id)">
    </lib-toast>

    }

</div>
