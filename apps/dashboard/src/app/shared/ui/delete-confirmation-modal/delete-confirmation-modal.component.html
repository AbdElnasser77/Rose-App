<p-dialog
  [visible]="isOpen()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [dismissableMask]="false"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [style]="{ width: '474px' }"
>
  <div class="flex flex-col items-center gap-6 text-center">
    <div class="relative flex h-[110px] w-[110px] items-center justify-center">
      <div class="absolute h-[105px] w-[105px] rounded-full bg-[#F4F4F5] dark:bg-zinc-800"></div>
      <div class="absolute h-[70px] w-[70px] rounded-full bg-[#E4E4E7] dark:bg-zinc-700"></div>
      <lucide-icon
        [img]="BrushCleaning"
        class="relative z-10 h-[29px] w-[29px] text-[#27272A] dark:text-white"
      />
    </div>

    <div>
      <h3 class="font-inter text-[20px] font-semibold leading-none text-[#27272A] dark:text-white">
        {{ title() | translate }}
      </h3>
      <p class="mt-3 font-inter text-sm leading-5 text-zinc-600 dark:text-zinc-300">
        {{ message() | translate }}
      </p>
    </div>

    <div class="flex w-full gap-[10px]">
      <button
        type="button"
        (click)="close()"
        class="flex-1 rounded-lg border border-[#F4F4F5] bg-[#D4D4D8] px-4 py-[14px] font-inter text-[16px] font-medium leading-none text-[#27272A] transition-colors hover:bg-[#d9d9db] dark:border-zinc-700 dark:bg-zinc-800 dark:text-white dark:hover:bg-zinc-700"
      >
        {{ 'DASHBOARD.DELETE_MODAL.CANCEL' | translate }}
      </button>
      <button
        type="button"
        (click)="confirm()"
        class="flex-1 rounded-lg bg-[#DC2626] px-4 py-[14px] font-inter text-[16px] font-medium leading-none text-white transition-colors hover:bg-[#B91C1C] dark:bg-[#F87171] dark:text-[#27272A] dark:hover:bg-[#FCA5A5]"
      >
        {{ 'DASHBOARD.DELETE_MODAL.CONFIRM' | translate }}
      </button>
    </div>
  </div>
</p-dialog>
