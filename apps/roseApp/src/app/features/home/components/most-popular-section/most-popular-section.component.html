<section class=" w-full px-4 sm:px-6 lg:px-[81px] mt-[138px]">
  <div class="w-full mx-auto">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-[40px]">
      <app-section-title
        [mainTitle]="'MOST_POPULAR.TITLE' | translate"
        [alignment]="'left'"
        class="w-full md:w-auto"
      ></app-section-title>

      <div class="flex flex-wrap items-center gap-6  text-zinc-700 dark:text-zinc-400">
        @for (tab of tabs; track tab.value) {
          <button
            type="button"
            class="tab-btn"
            [class.active]="activeTab() === tab.value"
            (click)="selectTab(tab.value)"
          >
            {{ tab.labelKey | translate }}
          </button>
        }
      </div>
    </div>

    @if (isLoading()) {
      <div class="grid grid-cols-1 sm:grid-cols-2  lg:grid-cols-3 xl:grid-cols-4 gap-x-[24px] gap-y-[34px] justify-items-center w-full">
        @for (item of [1, 2, 3, 4, 5, 6, 7, 8]; track item) {
          <div class="skeleton-card rounded-2xl"></div>
        }
      </div>
    } @else {
      <div class="grid grid-cols-1 sm:grid-cols-2  lg:grid-cols-3 xl:grid-cols-4 gap-x-[24px] gap-y-[34px] justify-items-center w-full">
        @for (product of displayedProducts(); track product.id) {
          <app-product-card
            [product]="product"
            [isWishlisted]="wishlistedIds().has(product.id)"
            (cardDetailsClicked)="goToProductDetails($event)"
            (quickViewClicked)="goToProductDetails($event)"
            (wishListClicked)="onWishlistClick($event)"            
            (addToCartClicked)="addToCartClicked($event)"
          ></app-product-card>
        }
      </div>

      @if (displayedProducts().length < filteredProducts().length) {
        <div class="view-more-wrapper">
          <button type="button" class="view-more-btn" (click)="viewMore()">
            {{ 'MOST_POPULAR.VIEW_MORE' | translate }}
            <span aria-hidden="true">↗</span>
          </button>
        </div>
      }
    }
  </div>
</section>
