<section libIntersectionObserverDirective [observeOnce]="true" (visibilityChange)="onBannerVisible($event)"
    class="w-full px-4 md:px-8 lg:px-[81px] mt-[41px]">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-[24px] w-full justify-items-center ">

        <div class="relative w-full overflow-hidden lg:col-span-1 h-[440px] rounded-[16px] 
            p-[24px] flex flex-col justify-between transition-all duration-700 ease-out " [ngClass]="{
    'opacity-100 translate-x-0': isBannerVisible(),
    'opacity-0 -translate-x-8': !isBannerVisible()
  }">


            <img [src]="'assets/images/banner/specialGifts.webp' | assetUrl"
                [alt]="'HERO.SIDE_BANNER.TITLE' | translate" class="absolute inset-0 w-full h-full object-cover pointer-events-none" />

            <div class="absolute inset-0 bg-black/10 pointer-events-none"></div>

            <div class=" mt-auto  relative z-10 p-[24px] flex flex-col gap-[10px]">
                <app-badge [text]="'HERO.SIDE_BANNER.BADGE' | translate" variant="secondary">

                </app-badge>
                <h3
                    class="font-sarabun font-semibold  text-[18px] sm:text-[20px] xl:text-[24px]  leading-none tracking-normal text-white mb-[8px]">
                    {{ 'HERO.SIDE_BANNER.TITLE' | translate }}</h3>

                <lib-button size="auto" (clicked)="goToProducts()"
                    customClass="text-maroon-700  w-[129px]  px-4 py-[10px] gap-[10px] mt-[30px] rtl:flex-row-reverse cursor-pointer"
                    variant="Secondary">
                    {{ 'HERO.SIDE_BANNER.BUTTON' | translate }}
                     @if (isRtl()) {
                <lucide-icon leftIcon [img]="ArrowLeft"></lucide-icon>
                }


                @if (!isRtl()) {
                <lucide-icon rightIcon [img]="ArrowRight"></lucide-icon>
                }

                </lib-button>

            </div>
        </div>

        <!-- Right Carousel -->
        <div class="relative w-full overflow-hidden lg:col-span-3 h-[440px] rounded-[16px]
        transition-all duration-700 ease-out delay-200" [ngClass]="{
            'opacity-100 translate-x-0': isBannerVisible(),
            'opacity-0 translate-x-8': !isBannerVisible()
        }">


            <swiper-container #bannerSwiper libSwiperDirective [config]="swiperConfig" init="false" class="h-full w-full"
               >


                @for (slide of slides; track $index) {

                <swiper-slide>
                    <div class="relative w-full h-[440px] p-[24px] flex flex-col justify-end">
                        <img [src]="slide.image | assetUrl" [alt]="slide.title"
                            class="absolute inset-0 w-full h-full object-cover pointer-events-none" />
                        <div class="absolute inset-0  bg-linear-to-r  from-black/80 to-transparent pointer-events-none"></div>

                        <div class="relative z-10 max-w-[500px] flex flex-col gap-[6px] mb-[40px] ml-[24px]">
                            <h2
                                class="font-sarabun font-semibold text-[36px] md:text-[48px] text-white m-0 leading-none">
                                {{ slide.title | translate }}</h2>
                            <p class="font-sarabun text-white text-[16px] font-normal m-0 leading-none tracking-normal">
                                {{ slide.subTitle | translate }}</p>

                            <lib-button size="auto" (clicked)="goToProducts()"
                                customClass=" w-[129px] py-[10px] px-[16px] gap-[10px] text-[16px] text-maroon-700 mt-[36px] cursor-pointer"
                                variant="Secondary">
                                {{ 'HERO.SLIDES.BUY_BUTTON' | translate }}
                            </lib-button>

                        </div>
                    </div>
                </swiper-slide>

                }



            </swiper-container>

            <div  
                class="absolute w-[74px] h-[35px] bottom-[31px] end-[32px] z-20  bg-[#FBEAEA] backdrop-blur-sm rounded-full shadow-md p-[2px]">

            <button
                class="hero-swiper-prev absolute left-0 top-0 w-[37px] h-full rounded-full flex items-center justify-center  transition-colors duration-200 hover:bg-white text-maroon-700 disabled:text-zinc-300 disabled:bg-transparent 
                cursor-pointer disabled:pointer-events-none disabled:cursor-not-allowed ">
                <lucide-icon [img]=" ChevronLeft" 
                    class="w-[30px] h-[30px] "></lucide-icon>
            </button>

            <button
                class="hero-swiper-next absolute right-0 top-0 w-[37px] h-full rounded-full flex items-center justify-center transition-colors duration-200 hover:bg-white text-maroon-700 disabled:text-zinc-300 disabled:bg-transparent 
                cursor-pointer disabled:pointer-events-none disabled:cursor-not-allowed  ">
                <lucide-icon [img]=" ChevronRight" 
                    class="w-[30px] h-[30px] "></lucide-icon>
            </button>

           </div>
        </div>
    </div>
</section>
