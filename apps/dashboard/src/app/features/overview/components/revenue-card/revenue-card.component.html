<app-overview-card titleKey="DASHBOARD.OVERVIEW.REVENUE">
  <div cardActions class="flex items-center gap-3">
    @for (option of periodOptions; track option.value) {
      <button
        type="button"
        class="cursor-pointer rounded-md px-1.5 py-1 text-sm transition-colors focus-visible:ring-2 focus-visible:ring-maroon-500 focus-visible:outline-none"
        [class]="
          option.value === activePeriod()
            ? 'font-semibold text-maroon-700 dark:text-soft-pink-300'
            : 'text-zinc-400 hover:text-zinc-600 dark:text-zinc-500 dark:hover:text-zinc-300'
        "
        [attr.aria-pressed]="option.value === activePeriod()"
        (click)="selectPeriod(option.value)"
      >
        {{ option.labelKey | translate }}
      </button>
    }
  </div>

  @if (loading()) {
    <div class="h-56 w-full animate-pulse rounded-xl bg-zinc-200 dark:bg-zinc-700"></div>
  } @else if (!series() || series()!.points.length === 0) {
    <p class="py-20 text-center text-sm text-zinc-500 dark:text-zinc-400">
      {{ 'DASHBOARD.OVERVIEW.EMPTY_REVENUE' | translate }}
    </p>
  } @else {
    <div class="h-56">
      <p-chart
        type="line"
        [data]="chartData()"
        [options]="chartOptions()"
        [plugins]="[peakLabelPlugin]"
        height="100%"
      />
    </div>
  }
</app-overview-card>
